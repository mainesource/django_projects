{% extends 'base_bootstrap.html' %}

{% block content %}
<h1>Add Breed</h1>
  <form method="post">
      {% csrf_token %}
      <table>
          {{ form.as_table }}
      </table>
      <input type="submit" value="Submit">
      <input type="submit" onclick="window.location='{% url 'cats:all_cats' %}' ; return false;" value="Cancel">
  </form>
{% endblock content %}
